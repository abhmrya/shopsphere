services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: shopsphere-frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - auth-services


  auth-services:
    build:
      context: .
      dockerfile: auth/Dockerfile

    container_name: shopsphere-auth

    env_file:
      - .env

    ports:
      - "8001:8000"

    depends_on:
      - auth-db


  auth-db:
    image: postgres:17-alpine

    container_name: shopsphere-auth-db

    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}

    ports:
      - "${AUTH_DB_PORT}:5432"

    volumes:
      - auth_postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7-alpine

    container_name: shopsphere-redis

    ports:
      - "6379:6379"


  celery-worker:
    build:
      context: .
      dockerfile: auth/Dockerfile

    container_name: shopsphere-celery-worker

    env_file:
      - .env

    depends_on:
      - redis
      - auth-db

    command: celery -A app.celery_app:celery_app worker --loglevel=info


volumes:
  auth_postgres_data: