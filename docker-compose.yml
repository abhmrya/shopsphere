services:

  # =======================================================
  # REDIS
  # =======================================================

  redis:
    image: redis:7-alpine

    container_name: shopsphere-redis

    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    networks:
      - shopsphere-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # =======================================================
  # AUTH SERVICE
  # =======================================================

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: shopsphere-auth

    restart: unless-stopped

    command:
      [
        "uvicorn",
        "services.auth_service.app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001"
      ]

    env_file:
      - .env

    environment:
      SERVICE_NAME: auth-service
      SERVICE_PORT: 8001

      REDIS_URL: redis://redis:6379/0

    ports:
      - "8001:8001"

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - shopsphere-network

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8001/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s


  # =======================================================
  # CELERY WORKER
  # =======================================================

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: shopsphere-celery-worker

    restart: unless-stopped

    command:
      [
        "celery",
        "-A",
        "services.auth_service.app.workers.celery_app",
        "worker",
        "--loglevel=info"
      ]

    env_file:
      - .env

    environment:
      SERVICE_NAME: celery-worker

      REDIS_URL: redis://redis:6379/0

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - shopsphere-network


  # =======================================================
  # CELERY BEAT
  # =======================================================

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: shopsphere-celery-beat

    restart: unless-stopped

    command:
      [
        "celery",
        "-A",
        "services.auth_service.app.workers.celery_app",
        "beat",
        "--loglevel=info"
      ]

    env_file:
      - .env

    environment:
      SERVICE_NAME: celery-beat

      REDIS_URL: redis://redis:6379/0

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - shopsphere-network


# =========================================================
# NETWORKS
# =========================================================

networks:
  shopsphere-network:
    driver: bridge


# =========================================================
# VOLUMES
# =========================================================

volumes:
  redis_data: